name = "aggs-global-ledger-api"
main = "cloudflare/worker.js"
compatibility_date = "2026-05-27"

routes = [
  { pattern = "aggsworld.net/api/*", zone_name = "aggsworld.net" },
  { pattern = "aggsworld.net/admin/api/*", zone_name = "aggsworld.net" }
]

[vars]
ALLOWED_HOSTS = "aggsworld.net"

[[kv_namespaces]]
binding = "AGGS_LEDGER"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
