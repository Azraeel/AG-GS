<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AG-GS Global Ledger Admin</title>
    <meta name="description" content="Admin workspace for AG-GS nation, trade, industrial, population, intelligence, military, naval, and equipment stats.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("aggs-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = stored || (prefersDark ? "dark" : "light");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2314171a'/%3E%3Cpath d='M8 8h32L8 40z' fill='%23f0c33b'/%3E%3Cpath d='M56 56H24l32-32z' fill='%230d65d9'/%3E%3C/svg%3E">

  <body data-app-mode="admin">
    <header class="topbar">

        <span></span>
      </div>
      <div class="brand-copy">
        <p class="eyebrow">AG-GS</p>
        <h1>Global Ledger</h1>
      </div>
      <div class="top-actions">
        <div class="source-pill">Admin workspace</div>
        <button class="theme-toggle" id="themeToggle" type="button" title="Toggle color theme" aria-label="Toggle color theme" aria-pressed="false">
          <span class="theme-toggle-label">Theme</span>
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-knob"></span>
          </span>
          <span class="theme-toggle-value">Light</span>
        </button>
      </div>
    </header>

    <nav class="tabs" aria-label="Primary views">
      <button class="tab is-active" type="button" data-tab="overview">Overview</button>
      <button class="tab" type="button" data-tab="editor" data-requires-admin="true">Editor</button>
      <button class="tab" type="button" data-tab="nations">Nations</button>

      <button class="tab" type="button" data-tab="national" data-related-tabs="national trade industrial population military intelligence">Status Tables</button>
      <button class="tab" type="button" data-tab="equipment" data-related-tabs="equipment rosterImport templateImport naval eclipse elections audit">Records</button>
      <button class="tab" type="button" data-tab="history" data-requires-admin="true">History</button>
    </nav>

    <main id="app" class="app-shell" aria-live="polite"></main>

    <footer class="footer">
      <span id="sourceNote"></span>
    </footer>
