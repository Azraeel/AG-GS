<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AG-GS Global Ledger Admin</title>
    <meta name="description" content="Admin workspace for AG-GS nation, trade, industrial, population, intelligence, military, naval, and equipment stats.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2314171a'/%3E%3Cpath d='M8 8h32L8 40z' fill='%23f0c33b'/%3E%3Cpath d='M56 56H24l32-32z' fill='%230d65d9'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../styles.css?v=20260527-admin">
  </head>
  <body data-app-mode="admin">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">
        <span></span>
      </div>
      <div class="brand-copy">
        <p class="eyebrow">AG-GS</p>
        <h1>Global Ledger</h1>
      </div>
      <div class="source-pill">Admin workspace</div>
    </header>

    <nav class="tabs" aria-label="Primary views">
      <button class="tab is-active" type="button" data-tab="overview">Overview</button>
      <button class="tab" type="button" data-tab="editor" data-requires-admin="true">Editor</button>
      <button class="tab" type="button" data-tab="nations">Nations</button>
      <button class="tab" type="button" data-tab="simulation" data-requires-admin="true">Simulation</button>
      <button class="tab" type="button" data-tab="national" data-related-tabs="national trade industrial population military intelligence">Status Tables</button>
      <button class="tab" type="button" data-tab="naval" data-related-tabs="naval equipment eclipse elections audit">Records</button>
    </nav>

    <section class="toolbar" aria-label="Dashboard filters">
      <label class="view-shell">
        <span>View</span>
        <select id="viewSelect"></select>
      </label>
      <label class="search">
        <span aria-hidden="true">Search</span>
        <input id="searchInput" type="search" placeholder="Nation, policy, status, class" autocomplete="off">
      </label>
      <label class="select-shell">
        <span>Nation</span>
        <select id="nationSelect"></select>
      </label>
    </section>

    <main id="app" class="app-shell" aria-live="polite"></main>

    <footer class="footer">
      <span id="sourceNote"></span>
    </footer>

    <script src="../data.js?v=20260527-admin"></script>
    <script src="../engine.js?v=20260527-admin"></script>
    <script src="../app.js?v=20260527-admin"></script>
  </body>
</html>
